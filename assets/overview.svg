<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc">
  <title id="title">FortiBar: one click, then out of your way</title>
  <desc id="desc">An illustrative flow, not a screenshot. The VPN Connect menu bar button appears while disconnected. One click connects through FortiClient. After connection the button and FortiClient window are hidden while the VPN remains active.</desc>
  <rect width="1000" height="290" rx="20" fill="#101827"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="36" y="42" font-size="13" font-weight="600" fill="#8faccb" letter-spacing="2">FORTIBAR · HOW IT WORKS</text>
    <g transform="translate(36 68)">
      <rect width="280" height="174" rx="14" fill="#1b293d" stroke="#35465d"/>
      <text x="20" y="32" font-size="12" fill="#a2b4ca">01 / DISCONNECTED</text>
      <rect x="20" y="50" width="240" height="44" rx="9" fill="#e8f1ff"/>
      <circle cx="42" cy="72" r="5" fill="#f59e0b"/>
      <text x="59" y="78" font-size="18" font-weight="600" fill="#18263b">Connect VPN</text>
      <text x="20" y="125" font-size="15" fill="#f2f5fa">The button appears.</text>
      <text x="20" y="148" font-size="13" fill="#a2b4ca">Ready when you need your VPN.</text>
    </g>
    <path d="M329 155h18m-6-6 6 6-6 6" stroke="#8199b7" stroke-width="2" fill="none"/>
    <g transform="translate(360 68)">
      <rect width="280" height="174" rx="14" fill="#1b293d" stroke="#35465d"/>
      <text x="20" y="32" font-size="12" fill="#a2b4ca">02 / ONE CLICK</text>
      <rect x="20" y="50" width="240" height="44" rx="9" fill="#314665"/>
      <text x="39" y="78" font-size="17" font-weight="600" fill="#f2f5fa">Keychain → FortiClient</text>
      <text x="20" y="125" font-size="15" fill="#f2f5fa">Your saved login connects.</text>
      <text x="20" y="148" font-size="13" fill="#a2b4ca">Complete MFA if required.</text>
    </g>
    <path d="M653 155h18m-6-6 6 6-6 6" stroke="#8199b7" stroke-width="2" fill="none"/>
    <g transform="translate(684 68)">
      <rect width="280" height="174" rx="14" fill="#17392f" stroke="#376255"/>
      <text x="20" y="32" font-size="12" fill="#9ccfba">03 / CONNECTED</text>
      <path d="m25 74 9 9 18-22" stroke="#79e6b0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="79" font-size="19" font-weight="600" fill="#eafbf3">VPN stays active</text>
      <text x="20" y="125" font-size="15" fill="#eafbf3">Window and button hidden.</text>
      <text x="20" y="148" font-size="13" fill="#a5cabc">The button returns if VPN drops.</text>
    </g>
    <text x="36" y="269" font-size="12" fill="#8faccb">Existing FortiClient profile · Password in macOS Keychain · No telemetry</text>
  </g>
</svg>
